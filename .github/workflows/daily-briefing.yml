name: Daily Briefing
  on:
    workflow_dispatch:
    schedule:
      - cron: "0 2 * * *"
  jobs:
    briefing:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.13"
        - run: pip install -r requirements.txt
        - run: python daily_briefing.py
          env:
            FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
